name: Daily Job Scraper
on:
  schedule:
    # Runs every day at 8:00 AM Pacific Time (15:00 UTC)
    - cron: '0 15 * * *'
  workflow_dispatch: # allows manual trigger from GitHub Actions tab
jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run job scraper
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL:       ${{ secrets.NOTIFY_EMAIL }}
          ADZUNA_APP_ID:      ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY:     ${{ secrets.ADZUNA_APP_KEY }}
          USAJOBS_API_KEY:    ${{ secrets.USAJOBS_API_KEY }}
        run: python scripts/job_scraper.py
      - name: Save seen jobs cache
        run: |
          git config --global user.email "brandon.coston925@gmail.com"
          git config --global user.name "Job Scraper Bot"
          git add seen_jobs.json || true
          git diff --staged --quiet || git commit -m "Update seen jobs cache"
          git push || true
